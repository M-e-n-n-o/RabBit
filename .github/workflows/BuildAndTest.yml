name: Build & Tests

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

env:
  BUILD_CONFIG_DIST:    MinSizeRel
  BUILD_CONFIG_DEBUG:   Debug
  BUILD_CONFIG_RELEASE: Release


jobs:
  Distribution:
    runs-on: windows-latest

    steps:
    # Setup
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/out -DRABBIT_API_VULKAN=OFF # Vulkan cannot be loaded in GitHub Actions

    # Distribution
    - name: Build shader compiler
      run: cmake --build ${{github.workspace}}/out --target ShaderCompilerD3D12 --config ${{env.BUILD_CONFIG_DIST}}

    - name: Run shader compiler
      run: ${{github.workspace}}\out\Core\tools\shaderCompiler\d3d12\MinSizeRel\ShaderCompilerD3D12.exe -extraSrc ${{github.workspace}}\Sample\src\shaders

    - name: Build
      run: cmake --build ${{github.workspace}}/out --config ${{env.BUILD_CONFIG_DIST}}

    - name: Tests
      working-directory: ${{github.workspace}}/out/Core/tests
      run: ctest



  Release:
    runs-on: windows-latest

    steps:
    # Setup
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/out -DRABBIT_API_VULKAN=OFF

    # Release
    - name: Build shaders
      run: cmake --build ${{github.workspace}}/out --target ShaderCompilerD3D12 --config ${{env.BUILD_CONFIG_RELEASE}}

    - name: Run shader compiler
      run: ${{github.workspace}}\out\Core\tools\shaderCompiler\d3d12\Release\ShaderCompilerD3D12.exe -extraSrc ${{github.workspace}}\Sample\src\shaders
  
    - name: Build
      run: cmake --build ${{github.workspace}}/out --config ${{env.BUILD_CONFIG_RELEASE}}

    - name: Tests
      working-directory: ${{github.workspace}}/out/Core/tests
      run: ctest



  Debug:
    runs-on: windows-latest

    steps:
    # Setup
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/out -DRABBIT_API_VULKAN=OFF

    # Debug
    - name: Build shaders
      run: cmake --build ${{github.workspace}}/out --target ShaderCompilerD3D12 --config ${{env.BUILD_CONFIG_DEBUG}}
    
    - name: Run shader compiler
      run: ${{github.workspace}}\out\Core\tools\shaderCompiler\d3d12\Debug\ShaderCompilerD3D12.exe -extraSrc ${{github.workspace}}\Sample\src\shaders

    - name: Build
      run: cmake --build ${{github.workspace}}/out --config ${{env.BUILD_CONFIG_DEBUG}}

    - name: Tests
      working-directory: ${{github.workspace}}/out/Core/tests
      run: ctest
